name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Tests (Test Stage)
      run: |
        pip install pytest
        pytest app.py

    - name: Mock Deploy (Deploy Stage)
      run: echo "Code tested successfully! Deploying to production server..."
